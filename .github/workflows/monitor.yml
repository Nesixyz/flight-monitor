name: 上海巴黎机票监控

# ⚠️ 重要：若修改 monitor.py 中的阶段小时集合（phase1_hours / phase2_hours / phase3_hours），
#   必须同步修改上面的 cron 表达式，否则会出现"触发了但脚本跳过"或"漏触发"。
# 对应关系：北京时间 = UTC + 8h
#   阶段1 {0,12,18} 北京时间  →  UTC {16, 4, 10}  →  cron: '0 4,10,16 * * *'
#   阶段2 {0,12}    北京时间  →  UTC {16, 4}       →  cron: '0 4,16 * * *'
#   阶段3 {0,6,12,18} 北京时间  →  UTC {16,22,4,10}  →  cron: '0 4,10,16,22 * * *'
# 当前 cron 使用阶段3 的4个时间点全集，由脚本内按阶段决定是否执行
on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      manual_run:
        description: '执行模式（选择"立即执行"会跳过阶段时段检查）'
        required: false
        default: 'true'
        type: choice
        options:
          - label: '立即执行（跳过时段检查）'
            value: 'true'
          - label: '按阶段时段策略决定（不在时段则不执行）'
            value: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor-run
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 缓存 node_modules（npm install 提速）
      - name: 缓存 npm 依赖
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 安装 npm 依赖
        run: npm install

      - run: cp config.example.json config.json

      - name: 运行监控
        env:
          MANUAL_RUN: ${{ github.event.inputs.manual_run == 'true' && '1' || '0' }}
        run: python3 monitor.py
        continue-on-error: true   # 后续看板和状态提交不受监控失败影响

      - name: 提交状态文件回主分支
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notified.json push_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新监控状态 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # pull --rebase + 重试，避免并发运行时 push 被拒导致状态丢失
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "提交成功（尝试 $i）"
              exit 0
            fi
            echo "提交失败（尝试 $i/3），3秒后重试..."
            sleep 3
          done
          echo "⚠️ 状态文件提交失败，本次状态未同步回仓库，下次运行可能重复推送"
          exit 1

      - name: 准备看板部署目录
        if: always()
        run: |
          mkdir -p public
          if [ -f dashboard.html ]; then
            cp dashboard.html public/index.html
          else
            echo "<!doctype html><meta charset=utf-8><title>未生成</title><p>监控失败或未生成 dashboard.html，请稍后查看</p>" > public/index.html
          fi

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: public

  deploy-pages:
    needs: monitor
    if: always()   # 即使 monitor 部分失败也尝试部署（artifact 中会有兜底 HTML）
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
