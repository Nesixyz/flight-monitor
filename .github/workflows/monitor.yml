name: 上海巴黎机票监控

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      manual_run:
        description: '手动触发立即执行（跳过时段检查）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor-run
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: cp config.example.json config.json

      - name: 运行监控
        env:
          MANUAL_RUN: ${{ github.event.inputs.manual_run == 'true' && '1' || '0' }}
        run: python3 monitor.py

      - name: 提交状态文件回主分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notified.json push_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新监控状态 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # pull --rebase + 重试，避免并发运行时 push 被拒导致状态丢失
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "提交成功（尝试 $i）"
              exit 0
            fi
            echo "提交失败（尝试 $i/3），3秒后重试..."
            sleep 3
          done
          echo "⚠️ 状态文件提交失败，本次状态未同步回仓库，下次运行可能重复推送"
          exit 1

      - name: 准备看板部署目录
        run: |
          mkdir -p public
          cp dashboard.html public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
