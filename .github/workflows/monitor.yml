name: 机票价格监控

# ⚠️ 重要：若修改 monitor.py 中的阶段小时集合（phase1_hours / phase2_hours / phase3_hours），
#   必须同步修改下面的 cron 表达式，否则会出现"触发了但脚本跳过"或"漏触发"。
# 对应关系：北京时间 = UTC + 8h
#   阶段1 {12}       北京时间  →  UTC {4}          →  cron: '0 4 * * *'
#   阶段2 {0,12}     北京时间  →  UTC {16, 4}      →  cron: '0 4,16 * * *'
#   阶段3 {0,12,18}  北京时间  →  UTC {16, 4, 10}  →  cron: '0 4,10,16 * * *'
# 当前 cron 使用阶段3 的3个时间点全集，由脚本内按阶段决定是否执行。
# 注意：脚本允许 cron 延迟 1 小时以内（当前小时或上一小时命中执行时段即可）。
# 注意：CI 实际使用的配置是 config.example.json（下面 cp 到 config.json），改参数请改它。
on:
  schedule:
    - cron: '0 4,10,16 * * *'
  workflow_dispatch:
    inputs:
      manual_run:
        description: '执行模式（选择 true 跳过时段检查，选择 false 按阶段策略执行）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor-run
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      has_dashboard: ${{ steps.prepare_dashboard.outputs.has_dashboard }}
    env:
      TZ: Asia/Shanghai
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 缓存 node_modules（npm install 提速）
      - name: 缓存 npm 依赖
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 安装 npm 依赖
        run: npm install

      - run: cp config.example.json config.json

      - name: 回归测试
        run: python3 -m unittest discover -s tests -v

      - name: 运行监控
        id: run_monitor
        env:
          # schedule 触发时 input 为空 → '0'；手动选 'true' → '1'
          MANUAL_RUN: ${{ github.event.inputs.manual_run == 'true' && '1' || '0' }}
        run: |
          # 调试输出：确认 MANUAL_RUN 值和 manual_run 原始值
          echo "event.inputs.manual_run=${{ github.event.inputs.manual_run }}"
          echo "MANUAL_RUN=$MANUAL_RUN"
          python3 monitor.py
        continue-on-error: true   # 后续看板和状态提交不受监控失败影响

      - name: 提交状态文件回主分支
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notified.json push_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新监控状态 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 提交回触发本次 workflow 的分支，不要将 feature branch rebase 到 main。
          # 并发由 workflow 顶层 concurrency 控制；push 被拒时明确失败，避免破坏分支历史。
          echo "保存状态到分支: ${GITHUB_REF_NAME}"
          if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
            echo "状态提交成功"
          else
            echo "::error::状态 push 失败；请检查分支更新，不要在 CI 中自动 rebase 到 main"
            exit 1
          fi

      - name: 准备看板部署目录
        if: always() && steps.run_monitor.outcome == 'success'
        id: prepare_dashboard
        run: |
          mkdir -p public
          if [ -f dashboard.html ]; then
            cp dashboard.html public/index.html
            echo "has_dashboard=true" >> $GITHUB_OUTPUT
          else
            echo "has_dashboard=false" >> $GITHUB_OUTPUT
            echo "dashboard.html 不存在（monitor.py 未生成），本次不部署看板，保留上次部署"
          fi

      - name: 配置 GitHub Pages 环境
        uses: actions/configure-pages@v5
        if: always() && steps.prepare_dashboard.outputs.has_dashboard == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.prepare_dashboard.outputs.has_dashboard == 'true'
        with:
          path: public

      - name: 将监控失败标记为工作流失败
        if: always() && steps.run_monitor.outcome == 'failure'
        run: |
          echo "::error::monitor.py 执行失败，请检查运行日志"
          exit 1

  deploy-pages:
    needs: monitor
    if: always() && needs.monitor.outputs.has_dashboard == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
